# Reproducible PostgreSQL 16 + Django ORM Certification Environment (Microtask 1D.2.1)
# Usage:
#   docker compose -f backend/docker-compose.postgres-test.yml up --build --abort-on-container-exit --exit-code-from django-certification

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fresh_cert_db
      POSTGRES_USER: fresh_cert_user
      POSTGRES_PASSWORD: fresh_cert_password_2026
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fresh_cert_user -d fresh_cert_db"]
      interval: 2s
      timeout: 3s
      retries: 15

  django-certification:
    image: python:3.11-slim
    working_dir: /workspace/backend
    volumes:
      - ../:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_ENV: test
      DEBUG: "True"
      SECRET_KEY: "Fresh_PgCert_Test_Key_2026_High_Entropy_9876543210_AbCdEfGhIjKlMnOpQrStUvWxYz"
      ALLOWED_HOSTS: "127.0.0.1,localhost,testserver"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: fresh_cert_db
      DB_USER: fresh_cert_user
      DB_PASSWORD: fresh_cert_password_2026
      DB_HOST: postgres
      DB_PORT: "5432"
    command: >
      bash -c "
        apt-get update && apt-get install -y --no-install-recommends libpq-dev gcc &&
        pip install --no-cache-dir -r requirements.txt &&
        bash scripts/run_postgres_certification.sh
      "
